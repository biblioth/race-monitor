name: Daily race and outdoor activity monitor
run-name: Race monitor · ${{ github.event_name == 'schedule' && 'GitHub fallback' || inputs.trigger || 'manual' }}

on:
  schedule:
    # Independent 10:17 Beijing fallback; Cloudflare is the 09:00 primary trigger.
    # Already-completed days skip browser installation and collection.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Trigger origin (Cloudflare sends cloudflare)"
        type: string
        default: manual
      preview:
        description: "Read sources without changing state or sending Feishu messages"
        type: boolean
        default: false
      refresh:
        description: "Manually recheck today's sources against persistent dedup state"
        type: boolean
        default: false
      runner:
        description: "GitHub hosted network environment"
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest
      network_probe:
        description: "Only test public source connectivity; do not read state or send messages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-race-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: vars.RACE_MONITOR_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.trigger != 'cloudflare')
    runs-on: ${{ inputs.runner || vars.RACE_MONITOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 23
    env:
      RACE_MONITOR_URL: https://race-monitor.spicyao-lakewatch.workers.dev
      RACE_MONITOR_ADMIN_TOKEN: ${{ secrets.RACE_MONITOR_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check whether today's collection is needed
        id: daily_check
        if: inputs.network_probe != true
        run: |
          if [ "$PREVIEW" = "true" ]; then
            echo "needs_collection=true" >> "$GITHUB_OUTPUT"
          else
            python -m race_monitor.service --check-needed ${{ inputs.refresh && '--refresh' || '' }}
          fi
        env:
          PREVIEW: ${{ inputs.preview }}
      - name: Install isolated browser for the official HK100 fallback
        if: inputs.network_probe != true && steps.daily_check.outputs.needs_collection == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Probe restricted public sources without sending notifications
        if: inputs.network_probe == true
        run: |
          python - <<'PY'
          import requests
          import subprocess
          from bs4 import BeautifulSoup
          from concurrent.futures import ThreadPoolExecutor
          urls = [
              "https://hk100ultra.com/",
              "https://hk100ultra.com/wp-json/wp/v2/pages/2",
              "https://www.kailas.com.cn/Home/Article/BrandNews/type/1.html",
          ]
          def probe(url):
              try:
                  r = requests.get(url, timeout=25)
                  print(url, "HTTP", r.status_code, "bytes", len(r.content), flush=True)
              except requests.RequestException:
                  print(url, "unreachable", flush=True)
              # A second standard HTTP client distinguishes transport/client
              # compatibility from a site-wide cloud network restriction.
              try:
                  r = subprocess.run(["curl", "--silent", "--show-error", "--location", "--max-redirs", "5", "--max-time", "25", "--max-filesize", "2000000", "--write-out", "\n%{http_code}", url], capture_output=True, timeout=30)
                  body, _, status = r.stdout.decode("utf-8", errors="replace").rpartition("\n")
                  title = BeautifulSoup(body, "html.parser").title
                  print(url, "curl HTTP", status, "exit", r.returncode, "title", title.get_text()[:120] if title else "(none)", flush=True)
              except subprocess.TimeoutExpired:
                  print(url, "curl timed out", flush=True)
          with ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(probe, urls))
          PY
      - name: Collect daily discoveries or compensate a missing batch
        if: inputs.network_probe != true
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ "$NEEDS_COLLECTION" = "true" ]; then
            xvfb-run -a python -m race_monitor.service ${{ inputs.preview && '--preview' || '' }} ${{ inputs.refresh && '--refresh' || '' }}
          else
            python -m race_monitor.service ${{ inputs.preview && '--preview' || '' }} ${{ inputs.refresh && '--refresh' || '' }}
          fi
        env:
          NEEDS_COLLECTION: ${{ steps.daily_check.outputs.needs_collection }}
      - name: Preserve source coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-monitor-report-${{ github.run_id }}
          path: .state/race-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Notify both Feishu robots if the job fails
        if: failure() && inputs.preview != true && inputs.network_probe != true
        run: |
          python -m race_monitor.service --failure-notify
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_ALERTS_WEBHOOK_URL: ${{ secrets.FEISHU_ALERTS_WEBHOOK_URL }}
          FEISHU_ALERTS_WEBHOOK_SECRET: ${{ secrets.FEISHU_ALERTS_WEBHOOK_SECRET }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
