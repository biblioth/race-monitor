name: Verify standalone migration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify migrated state and send one migration completion notice
        env:
          ADMIN_TOKEN: ${{ secrets.RACE_MONITOR_ADMIN_TOKEN }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request
          base = "https://race-monitor.spicyao-lakewatch.workers.dev"
          headers = {"Authorization": "Bearer " + os.environ["ADMIN_TOKEN"], "Content-Type": "application/json"}
          def call(path, body=None):
              req = urllib.request.Request(base + path, data=json.dumps(body).encode() if body is not None else None, headers=headers)
              with urllib.request.urlopen(req, timeout=40) as response:
                  return json.load(response)
          before = call("/races/state")
          assert len(before["state"]["known"]) == 76
          assert before["state"]["last_run_date"] == "2026-10-23"
          message = "✅ 赛事监控已迁移至独立仓库\n仓库：https://github.com/biblioth/race-monitor\n每天北京时间 09:00 检查，09:30 仅补偿未完成批次。\n继续使用原飞书机器人，76 个项目的历史去重记录已保留；报名变化和临近截止不提醒。"
          result = call("/races/commit", {"version": before["version"], "state": before["state"], "events": [{"key": "races:migration:standalone:20261023", "type": "race_migration_completed", "payload": {"message": message}}]})
          after = call("/races/state")
          assert after["state"] == before["state"]
          assert after["version"] == result["version"]
          print(json.dumps({"state_preserved": True, "known": len(after["state"]["known"]), "version": after["version"], "queued": result.get("queued")}))
          CHECK
