name: Verify both Feishu delivery paths
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: daily-race-monitor
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send one labeled message through each configured path
        env:
          ADMIN_TOKEN: ${{ secrets.RACE_MONITOR_ADMIN_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, time, urllib.request
          def call(url, body=None, headers=None):
              own_headers = {"User-Agent": "python-requests/2.32.5", "Content-Type": "application/json"}
              own_headers.update(headers or {})
              request = urllib.request.Request(url, data=json.dumps(body, ensure_ascii=False).encode() if body is not None else None, headers=own_headers)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          try:
              base = "https://race-monitor.spicyao-lakewatch.workers.dev"
              headers = {"Authorization": "Bearer " + os.environ["ADMIN_TOKEN"]}
              before = call(base + "/races/state", headers=headers)
              key = "races:channel-test:worker:" + os.environ["RUN_ID"]
              message = "🧪 赛事监控渠道测试\n发送路径：Worker 常规通知\n本条为测试消息，随后运行最新监控。"
              committed = call(base + "/races/commit", {"version": before["version"], "state": before["state"], "events": [{"key": key, "type": "race_digest", "payload": {"message": message}}]}, headers)
              after = call(base + "/races/state", headers=headers)
              assert after["state"] == before["state"], "Race state changed during test"
              print(json.dumps({"worker_test": "queued", "key": key, "state_preserved": True, "version": committed["version"]}), flush=True)
              payload = {"msg_type": "text", "content": {"text": "🧪 赛事监控渠道测试\n发送路径：GitHub 兜底通知\n本条为测试消息，随后运行最新监控。"}}
              secret = os.environ.get("FEISHU_WEBHOOK_SECRET")
              if secret:
                  stamp = str(int(time.time()))
                  payload.update(timestamp=stamp, sign=base64.b64encode(hmac.new((stamp + "\n" + secret).encode(), digestmod=hashlib.sha256).digest()).decode())
              result = call(os.environ["FEISHU_WEBHOOK_URL"], payload)
              assert result.get("code", result.get("StatusCode", -1)) in (0, "0"), "Feishu rejected test"
              print(json.dumps({"github_feishu_test": "accepted"}), flush=True)
          except Exception as error:
              raise SystemExit("Channel test failed: " + type(error).__name__) from None
          PY
